services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: flashsale-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4
      CLUSTER_ID: "MF5Svt9hRDGnEMwf4cghuQ"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.1
    container_name: flashsale-kafka-init
    depends_on:
      - kafka
    entrypoint: [ "bash", "-c" ]
    command: >
      "
      echo 'Esperando a que Kafka este listo...';
      cub kafka-ready -b kafka:29092 1 30;
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic purchase_intents --partitions 4 --replication-factor 1;
      echo 'Topic purchase_intents creado con 4 particiones (shards).';
      "

  mongo:
    image: mongo:7
    container_name: flashsale-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:1
    container_name: flashsale-mongo-express
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: bigdata
volumes:
  kafka-data:
  mongo-data: